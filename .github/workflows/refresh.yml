name: Refresh shows list

# Rebuilds index.html from the venue calendars in sources.yaml, so the
# published page stays current without anyone running the builder by hand.
# Forks get the same behavior once Actions are enabled on the fork.
on:
  schedule:
    # Daily at 12:00 UTC (6:00am CST / 7:00am CDT).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Rebuild the page
        run: python3 build.py
      - name: Commit updated page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to the page."
          else
            git commit -m "Refresh shows list"
            git push
          fi
