# Houston Shows List — sources
# Every venue the builder checks lives here. To add a venue, copy a block
# and change the values. To drop one, delete its block (or set type: none
# to keep it on the list as a placeholder). The builder only reads this
# file — no code changes needed.
#
# "type" tells the builder how to read the calendar:
#   tribe        the venue site's own WordPress events calendar (API/iCal)
#   mcgonigels   Mucky Duck's home-page show cards (embedded event data)
#   heights      Heights Theater's home-page show list
#   whiteoak     White Oak's home-page show list (TicketWeb cards)
#   squarespace_pages  Squarespace venue whose shows are individual pages
#   prekindle    a Prekindle venue events page
#   eventbrite   an Eventbrite organizer or collection page
#   ticketmaster matched out of the Ticketmaster city feed by venue name
#   jsonld       a page that embeds machine-readable event data (schema.org)
#   thundertix   a ThunderTix venue events page
#   html         a plain server-rendered events page the builder can read
#   dice         a DICE venue page (title + day-first date lines)
#   warehouselive Warehouse Live's calendar list view (date line + title line)
#   atg          an ATG Tickets listing (title / category / venue / date; Concert only)
#   none         no usable machine-readable calendar (yet) — builder skips
#                it and says so in the build report

